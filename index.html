<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TeamSalas-Lab: Salida y Reacción</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    body { font-family: system-ui; display: flex; flex-direction: column; align-items: center; background-color: #0f172a; color: white; margin: 0; padding: 20px; }
    
    .video-container { position: relative; width: 100%; max-width: 500px; height: 350px; margin-bottom: 15px; border: 2px solid #ef4444; border-radius: 15px; overflow: hidden; display: none; background-color: #000; }
    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; }
    #output_canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 10; pointer-events: none; }
    
    #display { font-size: 4rem; font-weight: bold; margin: 10px 0; color: #ef4444; text-align: center; }
    #status { font-size: 1.5rem; color: #94a3b8; margin-bottom: 25px; text-transform: uppercase; font-weight: bold; text-align: center; height: 35px; letter-spacing: 1px; }
    
    button { padding: 18px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; color: white; text-align: center; width: 100%; max-width: 350px; background-color: #ef4444; margin-bottom: 10px; transition: 0.3s; }
    
    #seqBtn { background-color: #3b82f6; display: none; }
    .loading { background-color: #64748b; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>TeamSalas LAB: Tacos de Salida</h2>
  <div id="status">ESPERANDO CÁMARA</div>
  <div id="display">0.000 s</div>

  <button id="liveBtn" onclick="iniciarIA()">🔴 ACTIVAR CÁMARA</button>
  <button id="seqBtn" onclick="iniciarSecuencia()">🏁 INICIAR SECUENCIA WA</button>

  <div class="video-container" id="vidContainer">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const display = document.getElementById('display');
    const status = document.getElementById('status');
    const liveBtn = document.getElementById('liveBtn');
    const seqBtn = document.getElementById('seqBtn');
    const vidContainer = document.getElementById('vidContainer');

    // Variables de la carrera
    let baselineHandY = null; 
    let gunTime = 0;
    const HAND_THRESHOLD = 0.02; // Sensibilidad de despegue de la mano
    let raceState = 'IDLE'; // IDLE, MARCAS, LISTOS, DISPARO, FINALIZADO
    let audioCtx = null;
    let sequenceTimeout1, sequenceTimeout2;

    const pose = new Pose({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
    }});
    
    pose.setOptions({
      modelComplexity: 1, 
      smoothLandmarks: true,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });
    pose.onResults(onResults);

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function emitirPitido(frequency, duration, type = 'sine') {
      if (!audioCtx) return;
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.type = type;
      oscillator.frequency.value = frequency;
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscillator.start();
      setTimeout(() => { oscillator.stop(); }, duration);
    }

    function iniciarIA() {
      initAudio();
      liveBtn.textContent = "CARGANDO MOTOR IA...";
      liveBtn.classList.add("loading");
      
      videoElement.setAttribute("autoplay", "true"); 
      videoElement.removeAttribute("controls"); 
      
      const camera = new Camera(videoElement, {
        onFrame: async () => { await pose.send({image: videoElement}); },
        width: 640, height: 480, // Apaisado (Horizontal) para abarcar la salida
        facingMode: 'environment'
      });
      
      camera.start().then(() => {
        vidContainer.style.display = "block";
        liveBtn.style.display = "none";
        seqBtn.style.display = "block";
        status.textContent = "POSICIÓN: PERFIL A LOS TACOS";
      });
    }

    function iniciarSecuencia() {
      // Reinicio seguro
      clearTimeout(sequenceTimeout1);
      clearTimeout(sequenceTimeout2);
      baselineHandY = null;
      display.textContent = "0.000 s";
      display.style.color = "#ef4444";
      seqBtn.disabled = true;
      seqBtn.style.backgroundColor = "#64748b";

      // 1. A sus marcas
      raceState = 'MARCAS';
      status.textContent = "A SUS MARCAS...";
      status.style.color = "#38bdf8";
      emitirPitido(400, 300);

      // 2. Listos (A los 3 segundos)
      sequenceTimeout1 = setTimeout(() => {
        raceState = 'LISTOS';
        status.textContent = "LISTOS...";
        status.style.color = "#eab308";
        emitirPitido(400, 300);
        
        // 3. Disparo (Aleatorio entre 1.5s y 2.5s después de "Listos")
        const randomHold = Math.floor(Math.random() * 1000) + 1500;
        sequenceTimeout2 = setTimeout(() => {
          if (raceState !== 'FALSO') { // Solo dispara si no hubo salida en falso
            raceState = 'DISPARO';
            status.textContent = "¡PUM!";
            status.style.color = "#22c55e";
            emitirPitido(800, 500, 'square'); // Sonido agudo y fuerte
            gunTime = performance.now() / 1000;
          }
        }, randomHold);

      }, 3000);
    }

    // LÓGICA BIOMECÁNICA (Motor de reacción)
    function onResults(results) {
      canvasElement.width = videoElement.videoWidth || 640;
      canvasElement.height = videoElement.videoHeight || 480;
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#ef4444', lineWidth: 2});
        drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#ffffff', lineWidth: 1, radius: 2});

        // Marcadores 15 y 16 (Muñecas)
        const leftWrist = results.poseLandmarks[15];
        const rightWrist = results.poseLandmarks[16];
        const currentHandY = (leftWrist.y + rightWrist.y) / 2; 

        // Fijar la línea base de las manos en el suelo justo al decir "Listos"
        if (raceState === 'LISTOS' && baselineHandY === null && currentHandY > 0) {
          baselineHandY = currentHandY;
        }

        if (baselineHandY !== null) {
          // Detectar si las manos se levantan
          if (currentHandY < (baselineHandY - HAND_THRESHOLD)) {
            
            // CASO A: Se movió en "LISTOS" antes del disparo
            if (raceState === 'LISTOS') {
              raceState = 'FALSO';
              clearTimeout(sequenceTimeout2);
              status.textContent = "¡SALIDA EN FALSO!";
              status.style.color = "#ef4444";
              emitirPitido(200, 1000, 'sawtooth'); // Sirena de error
              reiniciarBoton();
            } 
            
            // CASO B: Se movió tras el disparo
            else if (raceState === 'DISPARO') {
              raceState = 'FINALIZADO';
              const reactionTime = (performance.now() / 1000) - gunTime;
              display.textContent = reactionTime.toFixed(3) + " s";
              
              if (reactionTime < 0.100) {
                status.textContent = "FALSO (Regla 0.100s WA)";
                status.style.color = "#ef4444";
                emitirPitido(200, 1000, 'sawtooth');
              } else {
                status.textContent = "TR REGISTRADO";
                display.style.color = "#22c55e";
              }
              reiniciarBoton();
            }
          }
        }
      }
      canvasCtx.restore();
    }

    function reiniciarBoton() {
      seqBtn.disabled = false;
      seqBtn.style.backgroundColor = "#3b82f6";
      seqBtn.textContent = "🏁 REINICIAR SECUENCIA";
      baselineHandY = null;
    }
  </script>
</body>
</html>
